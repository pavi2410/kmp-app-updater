name: Release

on:
  release:
    types: [released, prereleased]

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Run all tests
        run: ./amper test

  publish:
    name: Publish to Maven Central
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Create publish credentials
        run: |
          cat > core/publish.properties <<'EOF'
          MAVEN_CENTRAL_USERNAME=${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD=${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          EOF

      - name: Publish core library to Maven Central
        run: ./amper publish -m core -r mavenCentral

  build-sample-android:
    name: Build sample Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Decode release keystore
        run: |
          echo "${{ secrets.SAMPLE_KEYSTORE_BASE64 }}" | base64 -d > sample-android/release.keystore
          cat > sample-android/keystore.properties <<'EOF'
          storeFile=./release.keystore
          storePassword=samplepass
          keyAlias=sample
          keyPassword=samplepass
          EOF

      - name: Build release Android APK
        run: ./amper build -m sample-android -v release

      - name: Upload Android APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/tasks/_sample-android_buildAndroidRelease/gradle-project-release-unsigned.apk

  build-desktop:
    name: Build desktop executable jar
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Build desktop executable jar
        run: ./amper package -m sample-desktop

      - name: Rename desktop artifact
        shell: bash
        run: cp build/tasks/_sample-desktop_executableJarJvm/sample-desktop-jvm-executable.jar sample-desktop-executable.jar

      - name: Upload desktop build to release
        uses: softprops/action-gh-release@v2
        with:
          files: sample-desktop-executable.jar
